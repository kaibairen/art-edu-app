services:
  postgres:
    image: postgres:16-alpine
    container_name: art-edu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: artedu
      POSTGRES_PASSWORD: artedu
      POSTGRES_DB: artedu
    ports:
      - "5432:5432"
    volumes:
      - art_edu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artedu -d artedu"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: art-edu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - art_edu_minio_data:/data
    profiles:
      - s3

  prism:
    image: stoplight/prism:5
    container_name: art-edu-prism
    command: ["mock", "-h", "0.0.0.0", "-p", "4010", "/tmp/openapi-p0.yaml"]
    volumes:
      - ./docs/contracts/openapi-p0.yaml:/tmp/openapi-p0.yaml:ro
    ports:
      - "4010:4010"
    profiles:
      - mock

volumes:
  art_edu_pg_data:
  art_edu_minio_data:
